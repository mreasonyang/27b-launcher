<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>27B Launcher · 首次使用设计草图</title>
<style>
:root{color-scheme:light;--bg:#eae9e6;--surface:#f8f8f7;--card:#fff;--text:#202020;--muted:#626260;--line:#d8d8d4;--accent:#b84b1a;--soft:#fff0e8;--green:#247347;--good:#edf6ef;--shadow:0 24px 64px #25231d18}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.55 -apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC",sans-serif}button,select{font:inherit;color:inherit;cursor:pointer}button{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:8px 15px;min-height:36px;transition:background .15s}button:hover{background:var(--soft)}button:focus-visible,summary:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:3px}button.primary{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:600;padding-inline:22px}button.primary:hover{filter:brightness(.92)}button.quiet{background:transparent;border-color:transparent;color:var(--muted)}button:disabled{opacity:.55;cursor:default}.review{max-width:980px;margin:26px auto 18px;padding:0 20px}.eyebrow{font-size:11px;font-weight:700;letter-spacing:2px;color:var(--muted)}.reviewbar{display:flex;align-items:center;justify-content:space-between;gap:18px;margin-top:8px;flex-wrap:wrap}.review h1{font-size:23px;margin:0;letter-spacing:-.7px}.controls{display:flex;gap:8px;flex-wrap:wrap}.controls select{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:7px 11px}.window{max-width:860px;margin:22px auto;background:var(--surface);border:1px solid #0002;border-radius:14px;box-shadow:var(--shadow);overflow:hidden}.titlebar{height:48px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 18px;font-size:12px;font-weight:600}.dots{display:flex;gap:8px;width:64px}.dots i{width:11px;height:11px;border-radius:50%;background:#ff6058;border:1px solid #0001}.dots i:nth-child(2){background:#ffbd2d}.dots i:nth-child(3){background:#28c840}.titlebar small{font-weight:400;color:var(--muted)}.screen{min-height:576px;display:flex;flex-direction:column}.inside{width:100%;max-width:660px;margin:0 auto;padding:26px 22px 20px;flex:1}.steps{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--muted);margin-bottom:24px}.step{display:flex;align-items:center;gap:6px;white-space:nowrap}.step b{border:1px solid var(--line);border-radius:50%;width:22px;height:22px;display:grid;place-items:center;font-size:11px}.step.current{color:var(--accent);font-weight:600}.step.current b{color:#fff;background:var(--accent);border-color:var(--accent)}.step.done b{color:var(--green);background:var(--good);border-color:transparent}.connector{height:1px;background:var(--line);flex:1}.heading{display:flex;align-items:center;gap:14px;margin-bottom:18px}.heading img{width:52px;height:52px;border-radius:12px}h2{font-size:26px;line-height:1.3;letter-spacing:-.8px;margin:0 0 7px;font-weight:650}p{margin:0;color:var(--muted)}.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px 20px;margin:18px 0}.row{display:flex;justify-content:space-between;align-items:center;gap:18px;padding:9px 0}.row+.row{border-top:1px solid var(--line)}.row strong{font-weight:550}.right{text-align:right}.sub{display:block;font-size:12px;color:var(--muted);margin-top:2px}.ok{color:var(--green)}.tiny{font-size:12px}.notice{background:var(--good);border-radius:8px;padding:11px 14px;color:var(--green);font-size:13px}.notice.warn{background:var(--soft);color:var(--accent)}details{margin-top:12px;font-size:13px;color:var(--muted)}summary{cursor:pointer;min-height:28px;padding:3px 0}.path{word-break:break-all;margin:8px 0}.footer{border-top:1px solid var(--line);padding:16px 24px;display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--card)}.footer p{font-size:12px}.actions{display:flex;gap:8px;flex-shrink:0}.phase{display:flex;gap:10px;align-items:center;color:var(--muted);font-size:13px;margin:18px 0}.phase .active{color:var(--accent);font-weight:600}.progress{height:6px;background:var(--line);border-radius:8px;margin:16px 0 10px;overflow:hidden}.bar{height:100%;background:var(--accent);border-radius:8px;width:62%}.meter{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}.big{font-size:30px;letter-spacing:-1px;font-weight:600;color:var(--text)}.cardtitle{display:flex;justify-content:space-between;align-items:center;gap:12px}.tag{font-size:12px;padding:3px 9px;border-radius:20px;background:var(--good);color:var(--green)}.tip{margin-top:20px;line-height:1.7;font-size:13px}.success{width:48px;height:48px;border-radius:50%;background:var(--good);color:var(--green);display:grid;place-items:center;font-size:25px;margin-bottom:18px}.example{font-size:15px;color:var(--text);margin:10px 0 16px}.callout{padding-left:13px;border-left:2px solid var(--line);font-size:13px;color:var(--muted);margin-top:20px}.notes{max-width:860px;margin:22px auto 36px;padding:0 16px;color:var(--muted);font-size:13px;display:grid;grid-template-columns:100px 1fr;gap:16px}.notes strong{color:var(--text)}.notes a{color:var(--accent)}.spin{display:inline-block;width:18px;height:18px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:spin 1s linear infinite;vertical-align:middle;margin-right:10px}@keyframes spin{to{transform:rotate(360deg)}}[data-theme=dark]{color-scheme:dark;--bg:#181919;--surface:#242525;--card:#2c2d2d;--text:#f1f0ed;--muted:#b7b8b3;--line:#4c4e4b;--accent:#c44f1c;--soft:#3c2c24;--green:#8cd1a6;--good:#25382d;--shadow:0 24px 64px #0005}[data-theme=dark] .step.current{color:#ffae86}[data-theme=dark] .notice.warn{color:#ffbd9e}[data-theme=dark] .phase .active{color:#ffae86}[data-theme=dark] .notes a{color:#ffae86}@media(max-width:700px){.window{margin:16px;border-radius:12px}.inside{padding:24px 20px}.review h1{font-size:20px}.footer{align-items:stretch;flex-direction:column}.footer .actions{justify-content:flex-end}.steps{gap:6px}.step{font-size:11px}.row{align-items:flex-start;gap:12px}h2{font-size:23px}.titlebar small{display:none}.notes{grid-template-columns:1fr;gap:4px}.heading img{width:44px;height:44px}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
<body>
<header class="review"><div class="eyebrow">27B LAUNCHER / DESIGN STUDY 01</div><div class="reviewbar"><h1>从第一次打开，到第一段对话。</h1><div class="controls"><label><span class="tiny">演示状态 </span><select id="scenario"><option value="prepare">准备下载</option><option value="download">下载中</option><option value="paused">已暂停</option><option value="network">网络中断</option><option value="verify">校验文件</option><option value="load">首次加载</option><option value="failed">启动失败</option><option value="ready">准备就绪</option><option value="dashboard">日常使用</option></select></label><button id="theme" aria-pressed="false">深色预览</button></div></div><p class="tiny" style="margin-top:8px">可点击概念稿 · 全部数据为示例 · 操作仅切换画面</p></header>
<section class="window" aria-label="27B Launcher 概念窗口"><div class="titlebar"><div class="dots" aria-hidden="true"><i></i><i></i><i></i></div><span>27B Launcher</span><small>首次使用</small></div><main id="screen" class="screen"></main></section>
<aside class="notes"><strong>设计意图</strong><div id="note"></div></aside>
<script>
const main=document.getElementById('screen'),selector=document.getElementById('scenario');let state='prepare';
const notes={prepare:'先回答空间、下载量和设备要求。一次明确的下载确认包含首次加载；语言跟随系统。正式版保留语言菜单。',download:'一个页面接续下载、校验和加载。下载进度采用实际字节数；预计剩余时间只在测速可靠后显示。',paused:'暂停是可恢复状态。按钮清楚地变为“继续下载”，已完成内容不丢失。',network:'在当前页面说明中断原因，保留进度。正式版只进行有限自动重试，超出上限后等待用户处理。',verify:'下载完成与模型可用分开表达。校验没有可靠总百分比时，使用不确定进度。',load:'告诉用户正在把模型加载到内存。不会用下载 100% 冒充整个过程完成。',failed:'安装文件仍然可用。重试只针对启动；技术信息放进可展开的详情。',ready:'准备完毕后等待用户打开浏览器。复制示例并非自动发出请求；原型中的复制按钮只展示反馈。',dashboard:'日常页面维持一个清楚的聊天入口，运行监控与高级设置按需展开。主界面重构仅展示信息层级。',deferred:'用户可以稍后继续。暂未安装时不进入看似可用的完整控制台；依赖模型的动作不出现。',opened:'概念稿到此完成；没有启动真实浏览器聊天页。真实产品只记录打开请求结果，首次回复由验收确认。'};
function steps(n){return '<nav class="steps" aria-label="设置进度">'+['准备','安装与加载','开始聊天'].map((t,i)=>`${i?'<span class="connector" aria-hidden="true"></span>':''}<span class="step ${i===n?'current':i<n?'done':''}" ${i===n?'aria-current="step"':''}><b>${i<n?'✓':i+1}</b>${t}</span>`).join('')+'</nav>'}
function heading(title,desc,icon=false){return `<div class="heading">${icon?'<img src="../27b-launcher-icon.svg" alt="">':''}<div><h2 tabindex="-1">${title}</h2><p>${desc}</p></div></div>`}
function button(label,next,primary=false){return `<button ${primary?'class="primary"':''} data-next="${next}">${label}</button>`}
function foot(text,buttons){return `<footer class="footer"><p>${text}</p><div class="actions">${buttons}</div></footer>`}
function render(next,focus=true){state=next;document.querySelector('.titlebar small').textContent=['dashboard','opened','deferred'].includes(state)?'本机 AI':'首次使用';selector.value=['deferred','opened'].includes(state)?'dashboard':state;document.getElementById('note').textContent=notes[state];let content='',footer='';
if(state==='prepare'){
content=steps(0)+heading('在这台 Mac 上开始使用 AI','下载 Bonsai 2 后，即可在本机聊天与辅助写作。',true)+`<div class="card"><div class="row"><strong>这台 Mac</strong><div class="right">Apple M 系列 · 32 GB 内存<span class="sub ok">✓ 满足当前硬件要求</span></div></div><div class="row"><strong>预计下载</strong><div class="right">7.86 GB<span class="sub">包含模型与所需运行组件</span></div></div><div class="row"><strong>保存位置</strong><div class="right">本机 · Bonsai2<span class="sub">安装需约 9 GB · 可用 126 GB</span></div></div><details><summary>查看路径与下载内容</summary><p class="path">~/Library/Application Support/Bonsai2/</p><p>模型 7.21 GB · 视觉组件 629 MB · 运行环境 11.7 MB · 适配器 9.7 MB</p><p>从 GitHub 和 Hugging Face 下载。安装后可在设置中更改模型位置。</p></details></div><div class="notice">首次下载需要联网；完成后，本机聊天可离线使用。</div>`;
footer=foot('自动下载、校验并加载模型。<br>完成后由你打开聊天。',button('稍后设置','deferred')+button('下载并准备','download',true));
}else if(['download','paused','network','verify','load','failed'].includes(state)){
const titles={download:['正在下载 Bonsai 2','可以收起窗口，准备过程会继续。'],paused:['下载已暂停','已保留进度，随时可以继续。'],network:['正在等待网络恢复','下载进度已保存，不需要从头开始。'],verify:['正在检查下载的文件','确认文件完整后，将自动加载模型。'],load:['正在加载模型','正在把模型加载到内存中。'],failed:['文件已安装，模型尚未启动','已下载的文件会保留，可以直接重试启动。']};
const downloading=['download','paused','network'].includes(state);const phase=downloading?0:state==='verify'?1:2;
content=steps(1)+heading(...titles[state])+`<div class="phase">${['下载','检查与配置','加载模型'].map((t,i)=>`${i?' <span aria-hidden="true">›</span> ':''}<span class="${phase===i?'active':''}">${i<phase?'✓ ':''}${t}</span>`).join('')}</div><div class="card"><div class="cardtitle"><div><strong>Bonsai 2</strong><span class="sub">本机 AI 模型</span></div>${downloading?'<span class="big">62<span style="font-size:16px">%</span></span>':'<span class="tag">下载完成</span>'}</div>${downloading?`<div class="progress" role="progressbar" aria-label="总下载进度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="62"><div class="bar"></div></div><div class="meter"><span>4.87 GB / 7.86 GB</span><span>${state==='download'?'18.2 MB/s · 约剩 3 分钟':state==='paused'?'已暂停':'等待网络'}</span></div>`:`<p style="margin-top:24px">${state==='failed'?'': '<span class="spin" aria-hidden="true"></span>'}${state==='verify'?'正在校验模型文件…':state==='load'?'正在等待本机服务就绪 · 已等待 12 秒':'启动未成功 · 无需重新下载模型'}</p>`}</div>${state==='network'?'<div class="notice warn">网络中断，连接恢复后将尝试继续。你也可以手动重试。</div>':state==='failed'?'<div class="notice warn">本机端口 8080 正在被其他程序占用。</div><details><summary>查看详情</summary><p>正式版在此提供对应错误和日志入口；只在确认进程归属后提供接管操作。</p></details>':'<p class="tip">模型准备好后，点击“开始聊天”，会在浏览器中打开本机聊天页面。</p>'}`;
let actions=state==='download'?button('暂停下载','paused'):state==='paused'?button('继续下载','download',true):state==='network'?button('立即重试','download',true):state==='failed'?button('重试启动','load',true):'<button disabled>正在准备…</button>';
footer=foot(state==='failed'?'下载和校验已完成。<br>解决问题后可重试启动。':state==='paused'?'已保存下载进度。<br>点击继续后恢复准备。':'关闭窗口可继续准备。<br>退出应用后，下载下次可续传。',actions);
}else if(state==='ready'){
content=steps(2)+`<div class="success" aria-hidden="true">✓</div>`+heading('准备好了，开始第一段对话','Bonsai 2 已在这台 Mac 上运行。')+`<p>点击“开始聊天”，在浏览器中打开本机聊天页面。</p><div class="card"><span class="sub">不知从哪开始？试试这句话</span><p class="example">用通俗的话解释一下，什么是大语言模型？</p><button id="copy">复制示例</button></div><details><summary>连接其他应用</summary><p>本机 API 基础地址：<code>http://127.0.0.1:8080/v1</code></p><p>模型 ID 可从 /v1/models 获取。其他设备访问可在主界面的高级设置中配置。</p></details>`;
footer=foot('仅在本机运行<br>默认设置即可开始',button('进入主界面','dashboard')+button('开始聊天','opened',true));
}else if(state==='deferred'){
content=heading('准备好时，再开始。','模型尚未安装。继续设置后，就能在这台 Mac 上聊天。',true)+`<div class="card"><div class="cardtitle"><strong>Bonsai 2</strong><span class="tag">等待设置</span></div><p class="tip">预计下载 7.86 GB。下载前会检查设备与可用空间。</p></div>`;
footer=foot('你的选择会被保留。',button('继续设置','prepare',true));
}else{
content=heading('Bonsai 2','本机运行中 · 可以开始聊天',true)+(state==='opened'?'<div class="notice">演示：已发出打开聊天页面的请求。</div>':'')+`<div class="card"><div class="cardtitle"><div><strong>你的本机 AI 已就绪</strong><span class="sub">通过浏览器中的聊天页面使用</span></div><span class="tag">运行中</span></div><div class="actions" style="margin-top:22px">${button('打开聊天','opened',true)}<button id="stop">停止模型</button></div></div><div class="callout" id="help">关闭窗口后模型仍可运行；点击“停止模型”可释放模型占用的内存。<button class="quiet" id="dismiss">知道了</button></div><details><summary>运行情况</summary><p>正式版在此显示实际内存、生成速度及请求统计。</p></details><details><summary>高级设置</summary><p>网络与 API · OrcaBonsai · 模型存储 · 登录时自动运行</p></details>`;
footer=foot('帮助菜单可随时重看快速入门。',button('重看引导','prepare'));
}
main.innerHTML='<div class="inside">'+content+'</div>'+footer;
main.querySelectorAll('[data-next]').forEach(b=>b.addEventListener('click',()=>render(b.dataset.next)));
const copy=document.getElementById('copy');if(copy)copy.onclick=()=>{copy.textContent='演示：已复制示例';};
const dismiss=document.getElementById('dismiss');if(dismiss)dismiss.onclick=()=>document.getElementById('help').remove();
const stop=document.getElementById('stop');if(stop)stop.onclick=()=>{render('dashboard');const h=main.querySelector('.heading p');h.textContent='已停止 · 模型占用的内存已释放';main.querySelector('.tag').textContent='已停止';main.querySelector('.card strong').textContent='随时可以再次开始';const start=main.querySelector('.primary');start.textContent='启动并聊天';start.dataset.next='load';document.getElementById('stop').disabled=true;};
if(focus)main.querySelector('h2')?.focus({preventScroll:true});
}
selector.onchange=()=>render(selector.value);document.getElementById('theme').onclick=e=>{const dark=document.documentElement.dataset.theme!=='dark';document.documentElement.dataset.theme=dark?'dark':'light';e.target.textContent=dark?'浅色预览':'深色预览';e.target.setAttribute('aria-pressed',String(dark));};render('prepare',false);
</script>
</body>
</html>
